apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ .Values.secrets.dbSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.applicationName }}
    component: {{ .Values.componentName }}
stringData:
  aspnetcorewebapi.postgresql.json: {{ required "A valid .Values.dbPassword is required!" .Values.dbPassword | quote }}
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ .Values.secrets.emailSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.applicationName }}
    component: {{ .Values.componentName }}
stringData:
  appsettings.email.json: {{ required "A valid .Values.emailCredentials is required!" .Values.emailCredentials | quote }}
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ .Values.secrets.jwtSigningKeySecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.applicationName }}
    component: {{ .Values.componentName }}
stringData:
  AuthSettings__SecretKey: {{ required "A valid .Values.jwtSigningKey is required!" .Values.jwtSigningKey | quote }}