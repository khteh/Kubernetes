apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: aspnetcorewebapi.postgresql
  namespace: {{ .Release.Namespace }}
stringData:
  aspnetcorewebapi.postgresql.json: {{ required "A valid .Values.dbPassword is required!" .Values.dbPassword | quote }}
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: email-credentials
  namespace: {{ .Release.Namespace }}
stringData:
  appsettings.email.json: {{ required "A valid .Values.emailCredentials is required!" .Values.emailCredentials | quote }}
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: aspnetcorewebapi.secretkey
  namespace: {{ .Release.Namespace }}
stringData:
  signingKey: {{ required "A valid .Values.jwtSigningKey is required!" .Values.jwtSigningKey | quote }}