apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.applicationName }}
    component: {{ .Values.componentName }}
stringData:
  aspnetcorewebapi.postgresql.json: {{ required "A valid .Values.database is required!" .Values.database | quote }}
  appsettings.email.json: {{ required "A valid .Values.emailserver is required!" .Values.emailserver | quote }}
  AuthSettings__SecretKey: {{ required "A valid .Values.jwtSigningKey is required!" .Values.jwtSigningKey | quote }}