apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.applicationName }}
  labels:
    component: {{ .Values.componentName }}
    app: {{ .Values.applicationName }}
spec:
  serviceName: {{ .Values.serviceName }}
  podManagementPolicy: {{ .Values.podManagementPolicy }}
  replicas: {{ .Values.replicaCount }}
  updateStrategy: 
    type: {{ .Values.updateStrategy }}
  selector:
    matchLabels:
      app: {{ .Values.applicationName }}
      component: {{ .Values.componentName }}
  template:
    metadata:
      labels:
        app: {{ .Values.applicationName }}
        component: {{ .Values.componentName }}
      annotations:
        # Re-evaluates on every upgrade; triggers restart if config changes
        checksum/config: {{ include (print $.Template.BasePath "/nodejsrestapi_config.yml") . | sha512sum }}        
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Values.applicationName }}
        image: "{{ .Values.image.application.repository }}:{{ .Values.image.application.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.application.pullPolicy }}
        env:
          - name: ENVIRONMENT
            value: {{ .Values.environment }}
          - name: NODE_ENV
            value: production
          - name: NODE_CONFIG_ENV
            value: {{ .Values.environment }}         # node-config: loads staging.json and local-staging.json            
          - name: DB_USERNAME
            valueFrom:
              secretKeyRef:
                name: {{ required "PostgreSQL DB username secretName!" .Values.postgresql.secretName }}
                key: {{ required "PostgreSQL DB username secretKey!" .Values.postgresql.user }}
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ required "PostgreSQL DB password secretName!" .Values.postgresql.secretName }}
                key: {{ required "PostgreSQL DB password secretKey!" .Values.postgresql.passwordKey }}
          - name: GEMINI_API_KEY
            valueFrom:
              secretKeyRef: 
                name: {{ .Values.secrets.name }}
                key: GEMINI_API_KEY
        ports:
        - containerPort: {{ .Values.service.port }}
          name: {{ .Values.service.portName }}
          protocol: {{ .Values.service.protocol }}
        {{- with .Values.startupProbe }}
        startupProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
          # Mount only this file, next to the image's default.json and custom-environment-variables.json.
          - name: nodejsrestapi-config
            mountPath: /app/config/local-{{ .Values.environment }}.json
            subPath: local-{{ .Values.environment }}.json
            readOnly: true
          - name: log
            mountPath: /var/log/nodejsrestapi
        {{- with .Values.resources.application }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      - name: {{ .Values.sidecarName }}
        image: "{{ .Values.image.sidecar.repository }}:{{ .Values.image.sidecar.tag }}"
        volumeMounts:
          - name: log
            mountPath: /var/log/nodejsrestapi
          - name: nodejs-fluentd-config
            mountPath: /fluentd/etc
          - name: elasticsearch-template
            mountPath: /tmp/elasticsearch_template.json
            subPath: elasticsearch_template.json
            readOnly: true
        {{- with .Values.resources.sidecar }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
