apiVersion: v1
kind: ConfigMap
metadata:
  name: nodejsrestapi
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.applicationName }}
    component: {{ .Values.componentName }}
data:
  local-{{ .Values.environment }}.json: |
    {
      "db": {
        "host": "svc-postgresql",
        "port": 5432,
        "database": "school"
      },
      "grpc": {
        "port": 444,
        "requireClientCertificate": true
      }
    }
