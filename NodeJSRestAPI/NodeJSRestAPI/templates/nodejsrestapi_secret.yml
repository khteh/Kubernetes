apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.applicationName }}
    component: {{ .Values.componentName }}
stringData:
  GEMINI_API_KEY: {{- required "A valid .Values.GEMINI_API_KEY is required!" .Values.GEMINI_API_KEY | nindent 4 }}