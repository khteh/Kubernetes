apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ .Values.secrets.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.applicationName }}
    component: {{ .Values.componentName }}
stringData:
  NEO4J_AUTH: {{ required "A valid .Values.NEO4J_AUTH is required!" .Values.NEO4J_AUTH | quote }}
