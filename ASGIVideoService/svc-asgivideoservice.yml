apiVersion: v1
kind: Service
metadata:
  name: svc-asgivideoservice
  #  annotations:
  #    alb.ingress.kubernetes.io/healthcheck-path: /asgivideoservice/actuator/health
  labels:
    app: asgivideoservice
    component: asgivideoservice
spec:
  ports:
    - name: https-udp
      protocol: UDP
      port: 443
      targetPort: https-udp
  clusterIP: None # Headless. type cannot be LoadBalancer
  selector:
    app: asgivideoservice
    component: asgivideoservice
#    tier: frontend
#  type: LoadBalancer # Exposes web to traffic from outside of the cluster
---
apiVersion: v1
kind: Service
metadata:
  name: svc-asgivideoservice-nodeport
  labels:
    app: asgivideoservice
    component: asgivideoservice
spec:
  ports:
    - name: https-udp
      protocol: UDP
      port: 443
      targetPort: https-udp
      nodePort: 31001
  type: NodePort
  selector:
    app: asgivideoservice
    component: asgivideoservice
