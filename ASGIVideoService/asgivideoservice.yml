apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: asgivideoservice
  labels:
    app: asgivideoservice
    component: asgivideoservice
spec:
  serviceName: svc-asgivideoservice
  podManagementPolicy: Parallel # Default is OrderedReady
  replicas: 2 # Default is 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: asgivideoservice # Has to match .spec.template.metadata.labels
      component: asgivideoservice
  template:
    metadata:
      labels:
        app: asgivideoservice # Has to match .spec.selector.matchLabels
        component: asgivideoservice
    spec:
      terminationGracePeriodSeconds: 10
      #      affinity:
      #        podAntiAffinity:
      #          requiredDuringSchedulingIgnoredDuringExecution:
      #          - labelSelector:
      #              matchExpressions:
      #              - key: app
      #                operator: In
      #                values:
      #                - asgivideoservice
      #            topologyKey: "kubernetes.io/hostname"
      containers:
        - name: asgivideoservice
          image: khteh/asgi-video-service:latest
          imagePullPolicy: Always
          env:
            - name: AI_VIDEO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: asgivideoservice-secret  # CHANGE ME
                  key: AI_VIDEO_API_KEY
                  optional: true  # unset is fine when GENERATION_PROVIDER=simulated
            - name: LLM_VALIDATION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: asgivideoservice-secret  # CHANGE ME
                  key: LLM_VALIDATION_API_KEY
                  optional: true  # optional even in any mode - see README "Configuration"
          ports:
            - containerPort: 443
              name: https-udp
              protocol: UDP
          startupProbe: # failureThreshold * periodSeconds long enough to cover the worst case startup time
            httpGet:
              path: /health/ready?fresh=true
              port: https-udp
              scheme: HTTPS
              #httpHeaders:
              #  - name: Host
              #    value: khteh.com
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /health/ready
              port: https-udp
              scheme: HTTPS
              #httpHeaders:
              #  - name: Host
              #    value: khteh.com
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health/live
              port: https-udp
              scheme: HTTPS
              #httpHeaders:
              #  - name: Host
              #    value: khteh.com
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          volumeMounts:
            - name: asgivideoservice-config
              mountPath: /etc/asgivideoservice_config.json
              subPath: asgivideoservice_config.json
              readOnly: true
            # If your volumeMounts configuration relies on a subPath, it forces Kubernetes to look for specific file keys inside the Secret before the container starts. [1] (https://stackoverflow.com/questions/77804867/mountvolume-setup-failed-for-volume-my-volume-references-non-existent-secret)
            # When a subPath is specified, Kubernetes hard-fails during the setup step if the Secret is missing, entirely bypassing the optional: true behavior.
            - name: asgivideoservice-secret
              mountPath: /app/.env
              subPath: .env
              readOnly: true
            - name: hypercorn-config
              mountPath: /etc/hypercorn.toml
              subPath: hypercorn.toml
              readOnly: true              
            - name: log
              mountPath: /var/log/asgivideoservice
            - name: hypercornlog
              mountPath: /var/log/hypercorn
          resources:
            limits:
              cpu: 500m
              memory: 2Gi
        - name: fluentd
          image: khteh/fluentd:latest
          volumeMounts:          
            - name: log
              mountPath: /var/log/asgivideoservice
            - name: hypercornlog
              mountPath: /var/log/hypercorn
            - name: asgivideoservice-fluentd-config
              mountPath: /fluentd/etc
            - name: elasticsearch-template
              mountPath: /tmp/elasticsearch_template.json
              subPath: elasticsearch_template.json
              readOnly: true
            #- mountPath: /fluentd/elastic/tls.crt
            #  name: elasticsearch-ca
            #  subPath: tls.crt
            #  readOnly: true
          resources:
            limits:
              cpu: 500m
              memory: 2Gi
      volumes:
        - name: hypercorn-config
          configMap:
            name: hypercorn-config
        - name: asgivideoservice-config
          configMap:
            name: asgivideoservice
        - name: asgivideoservice-secret
          secret:
            secretName: asgivideoservice-secret
            items:
              - key: .env
                path: .env
        - name: asgivideoservice-fluentd-config
          configMap:
            name: asgivideoservice-fluentd-config
        - name: elasticsearch-template
          configMap:
            name: elasticsearch-template
        - name: log
          emptyDir: {}
        - name: hypercornlog
          emptyDir: {}
        #- name: elasticsearch-ca
        #  secret:
        #    defaultMode: 420
        #    optional: false
        #    secretName: elasticsearch-eck-ca
