apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.applicationName }}
    component: {{ .Values.componentName }}
stringData:
  .env: |
    {{- required "A valid .Values.appEnv is required!" .Values.appEnv | nindent 4 }}