apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ .Values.secrets.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.applicationName }}
    component: {{ .Values.componentName }}
stringData:
  postgresql-user: {{ required "A valid .Values.username is required!" .Values.username | quote }}
  postgresql-password: {{ required "A valid .Values.password is required!" .Values.password | quote }}
  superUserPassword: {{ required "A valid .Values.superUserPassword is required!" .Values.superUserPassword | quote }}
  replicationUserPassword: {{ required "A valid .Values.replicationUserPassword is required!" .Values.replicationUserPassword | quote }}